name: Cleanup Existing Spam

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only report, do not delete)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      scan_issues:
        description: 'Scan open issues'
        required: false
        default: 'true'
        type: boolean
      scan_closed_issues:
        description: 'Scan closed issues (may find previously closed spam)'
        required: false
        default: 'false'
        type: boolean
      scan_comments:
        description: 'Scan issue comments'
        required: false
        default: 'true'
        type: boolean
      max_issues:
        description: 'Max number of issues to scan (0 = all)'
        required: false
        default: '100'
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Scan and cleanup spam
        uses: actions/github-script@v7
        env:
          SPAM_DETECTION_SCRIPT: ${{ secrets.SPAM_DETECTION_SCRIPT }}
        with:
          script: |
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            const scanIssues = '${{ inputs.scan_issues }}' === 'true';
            const scanClosedIssues = '${{ inputs.scan_closed_issues }}' === 'true';
            const scanComments = '${{ inputs.scan_comments }}' === 'true';
            const maxIssues = parseInt('${{ inputs.max_issues }}') || 0;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`Starting cleanup with hidden detection logic`);
            core.info(`  Dry run: ${dryRun}`);
            core.info(`  Scan open issues: ${scanIssues}`);
            core.info(`  Scan closed issues: ${scanClosedIssues}`);
            core.info(`  Scan comments: ${scanComments}`);
            core.info(`  Max issues to scan: ${maxIssues === 0 ? 'All' : maxIssues}`);
            core.info(``);

            // 创建检测函数 - 修复版本
            const createAnalyzer = () => {
              return async (content, author, association) => {
                const contentLower = content.toLowerCase();
                
                // 恶意内容关键词检测 - 包含标题和正文
                const defamationPatterns = {
                  personalAttacks: [
                    '骗子', '诈骗', '骗钱', '垃圾', '废物', '无耻', '不要脸', '人渣',
                    'stupid', 'idiot', 'moron', 'scammer', 'fraud', 'cheater'
                  ],
                  falseAccusations: [
                    '偷窃', '抄袭', '剽窃', '造假', '欺诈', '违法', '犯罪', '坐牢',
                    'stealing', 'plagiarism', 'fake', 'illegal', 'criminal'
                  ],
                  extremeEmotions: [
                    '天理难容', '不得好死', '断子绝孙', '去死', '滚蛋',
                    'die', 'kill yourself', 'go to hell'
                  ],
                  projectDefamation: [
                    '垃圾项目', '骗局', '圈钱', '迟早倒闭', '建议解散',
                    'scam project', 'ponzi scheme', 'worthless'
                  ]
                };

                let score = 0;
                let detectedPatterns = [];

                // 计算分数
                for (const [category, keywords] of Object.entries(defamationPatterns)) {
                  const matches = keywords.filter(keyword => 
                    contentLower.includes(keyword.toLowerCase())
                  );
                  
                  if (matches.length > 0) {
                    detectedPatterns.push(`${category}`);
                    
                    const weights = {
                      personalAttacks: 3,
                      falseAccusations: 4,
                      extremeEmotions: 5,
                      projectDefamation: 3
                    };
                    
                    score += matches.length * weights[category];
                    core.info(`检测到 ${category} 类别关键词: ${matches.join(', ')}`);
                  }
                }

                // 检测无证据的虚假指控
                # const claimIndicators = ['声称', '据说', '听说', 'allegedly', 'claimed'];
                # const evidenceIndicators = ['证据', '证明', '截图', '链接', 'evidence', 'proof'];
                
                # const hasClaims = claimIndicators.some(indicator => content.includes(indicator));
                # const hasEvidence = evidenceIndicators.some(indicator => content.includes(indicator));
                
                # if (hasClaims && !hasEvidence) {
                #   score += 8;
                #   detectedPatterns.push('false_claims_without_evidence');
                #   core.info(`检测到无证据指控`);
                # }

                // 检测过度情绪化（判断感叹号数量）
                # const exclamationCount = (content.match(/!/g) || []).length;
                # if (exclamationCount > 3) {
                #   score += exclamationCount;
                #   detectedPatterns.push('excessive_exclamation');
                #   core.info(`检测到过度情绪化: ${exclamationCount} 个感叹号`);
                # }

                // 调试信息
                core.info(`详细分析: 用户=${author}, 内容长度=${content.length}, 分数=${score}, 模式=${detectedPatterns.join(',')}`);

                // 决策逻辑 - 降低阈值以便测试
                const isSpam = score >= 10; 

                return {
                  isSpam,
                  score,
                  reason: isSpam ? `检测到恶意内容 (分数: ${score})` : '正常内容',
                  detectedPatterns
                };
              };
            };

            let totalScanned = 0;
            let totalSpam = 0;
            let totalClosed = 0;
            let totalDeleted = 0;
            let totalModerated = 0;

            try {
              const analyzeContent = createAnalyzer();
              core.info("✅ 垃圾检测模块加载成功");

              // 扫描开放中的Issue
              if (scanIssues) {
                core.info("📝 扫描开放中的Issue...");
                let page = 1;
                let openScanned = 0;

                while (maxIssues === 0 || openScanned < maxIssues) {
                  const issues = await github.rest.issues.listForRepo({
                    owner, repo, state: 'open', per_page: 100, page
                  });

                  if (issues.data.length === 0) break;

                  for (const issue of issues.data) {
                    if (issue.pull_request) continue;
                    if (maxIssues > 0 && openScanned >= maxIssues) break;

                    openScanned++;
                    totalScanned++;

                    core.info(`扫描Issue #${issue.number}: "${issue.title}"`);

                    // 结合标题和正文进行检测
                    const fullContent = (issue.title + ' ' + (issue.body || '')).toLowerCase();
                    
                    const analysis = await analyzeContent(
                      fullContent,
                      issue.user?.login || "unknown",
                      issue.author_association || "NONE"
                    );

                    if (analysis.isSpam) {
                      totalSpam++;
                      core.warning(`🚨 [SPAM] Issue #${issue.number} by @${issue.user?.login}`);
                      core.warning(`   标题: ${issue.title}`);
                      core.warning(`   分数: ${analysis.score}, 模式: ${analysis.detectedPatterns.join(', ')}`);
                      core.warning(`   预览: ${(issue.body || "").substring(0, 100).replace(/\n/g, ' ')}...`);

                      if (!dryRun) {
                        try {
                          await github.rest.issues.update({
                            owner, repo, issue_number: issue.number,
                            state: "closed", state_reason: "not_planned"
                          });
                          await github.rest.issues.createComment({
                            owner, repo, issue_number: issue.number,
                            body: `此Issue因检测到不当内容已被自动关闭。\n\n` +
                                  `检测分数: ${analysis.score}\n` +
                                  `检测模式: ${analysis.detectedPatterns.join(', ')}\n\n` +
                                  `如需建设性反馈，请提供具体事实和证据。`
                          });
                          totalClosed++;
                          core.notice(`✅ 已关闭垃圾Issue #${issue.number}`);
                        } catch (err) {
                          core.error(`❌ 关闭Issue #${issue.number}失败: ${err.message}`);
                        }
                      } else {
                        core.notice(`⚠️  [DRY RUN] 检测到垃圾Issue #${issue.number} (未执行操作)`);
                      }
                    } else {
                      core.info(`✅ Issue #${issue.number} 检测为正常内容`);
                    }
                  }
                  page++;
                }
                core.info(`扫描完成: ${openScanned}个开放中的Issue`);
              }

              // 扫描已关闭的Issue
              if (scanClosedIssues) {
                core.info("📚 扫描已关闭的Issue...");
                let page = 1;
                let closedScanned = 0;

                while (maxIssues === 0 || closedScanned < maxIssues) {
                  const issues = await github.rest.issues.listForRepo({
                    owner, repo, state: 'closed', per_page: 100, page
                  });

                  if (issues.data.length === 0) break;

                  for (const issue of issues.data) {
                    if (issue.pull_request) continue;
                    if (maxIssues > 0 && closedScanned >= maxIssues) break;

                    closedScanned++;
                    totalScanned++;

                    const fullContent = (issue.title + ' ' + (issue.body || '')).toLowerCase();
                    const analysis = await analyzeContent(
                      fullContent,
                      issue.user?.login || "unknown",
                      issue.author_association || "NONE"
                    );

                    if (analysis.isSpam) {
                      totalSpam++;
                      core.warning(`🚨 [SPAM] 已关闭Issue #${issue.number} by @${issue.user?.login}`);
                      core.warning(`   分数: ${analysis.score}, 模式: ${analysis.detectedPatterns.join(', ')}`);

                      if (!dryRun) {
                        try {
                          await github.rest.issues.update({
                            owner, repo, issue_number: issue.number,
                            title: "[已处理] 内容已移除",
                            body: "**此内容因违反社区准则已被自动处理。**\n\n" +
                                  "原始内容包含不当言论，现已被隐藏。\n\n" +
                                  "_此操作是在现有内容清理扫描中自动执行的。_"
                          });
                          totalModerated++;
                          core.notice(`✅ 已处理已关闭垃圾Issue #${issue.number}`);
                        } catch (err) {
                          core.error(`❌ 处理已关闭Issue #${issue.number}失败: ${err.message}`);
                        }
                      } else {
                        core.notice(`⚠️  [DRY RUN] 检测到已关闭垃圾Issue #${issue.number} (未执行操作)`);
                      }
                    }
                  }
                  page++;
                }
                core.info(`扫描完成: ${closedScanned}个已关闭的Issue`);
              }

              // 扫描评论
              if (scanComments) {
                core.info("💬 扫描评论...");
                let page = 1;
                let commentCount = 0;

                while (page <= 10 && (maxIssues === 0 || commentCount < maxIssues)) {
                  const comments = await github.rest.issues.listCommentsForRepo({
                    owner, repo, per_page: 100, page, sort: 'created', direction: 'desc'
                  });

                  if (comments.data.length === 0) break;

                  for (const comment of comments.data) {
                    if (maxIssues > 0 && commentCount >= maxIssues) break;

                    commentCount++;
                    totalScanned++;

                    const analysis = await analyzeContent(
                      comment.body || "",
                      comment.user?.login || "unknown",
                      comment.author_association || "NONE"
                    );

                    if (analysis.isSpam) {
                      totalSpam++;
                      core.warning(`🚨 [SPAM] 评论 #${comment.id} by @${comment.user?.login}`);
                      core.warning(`   分数: ${analysis.score}, 模式: ${analysis.detectedPatterns.join(', ')}`);

                      if (!dryRun) {
                        try {
                          await github.rest.issues.deleteComment({
                            owner, repo, comment_id: comment.id
                          });
                          totalDeleted++;
                          core.notice(`✅ 已删除垃圾评论 #${comment.id}`);
                        } catch (err) {
                          core.error(`❌ 删除评论 #${comment.id}失败: ${err.message}`);
                        }
                      } else {
                        core.notice(`⚠️  [DRY RUN] 检测到垃圾评论 #${comment.id} (未执行操作)`);
                      }
                    }
                  }
                  page++;
                }
                core.info(`扫描完成: ${commentCount}条评论`);
              }

            } catch (err) {
              core.error(`扫描过程出错: ${err.message}`);
              core.setFailed(`执行失败`);
              return;
            }

            // 生成总结报告
            core.notice("=".repeat(60));
            core.notice(`📊 清理总结 ${dryRun ? '(干运行模式)' : '(已执行)'}`);
            core.notice("=".repeat(60));
            core.notice(`📝 扫描统计:`);
            core.notice(`   • 总计扫描: ${totalScanned}`);
            core.notice(``);
            core.notice(`🚨 检测结果:`);
            core.notice(`   • 发现的垃圾内容: ${totalSpam}`);
            if (!dryRun) {
              core.notice(``);
              core.notice(`✅ 执行的操作:`);
              core.notice(`   • 关闭的Issue: ${totalClosed}`);
              core.notice(`   • 处理的已关闭Issue: ${totalModerated}`);
              core.notice(`   • 删除的评论: ${totalDeleted}`);
              core.notice(`   • 总计操作: ${totalClosed + totalModerated + totalDeleted}`);
            } else {
              core.notice(``);
              core.notice(`⚠️  干运行模式 - 未执行任何操作`);
              core.notice(`   设置 dry_run: false 来执行实际清理`);
            }
            core.notice("=".repeat(60));

            if (totalSpam > 0 && dryRun) {
              core.notice(`💡 建议: 发现 ${totalSpam} 个潜在的垃圾内容，请审查后执行清理。`);
            }
